name: Build server images

on:
  push:
    branches: [master]
    paths:
      - 'MuEmu/**'
      - 'CSEmu/**'
      - 'MU.Network/**'
      - 'MU.Resources/**'
      - 'MU.Tool/**'
      - 'PacketHelper/**'
      - 'SimpleModulus/**'
      - 'WebZen.DataBase/**'
      - 'BlubLib/**'
      - 'Data/**'
      - 'docker/**'
      - '.github/workflows/build.yml'
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: gameserver
            dockerfile: docker/Dockerfile.gameserver
          - name: connectserver
            dockerfile: docker/Dockerfile.connectserver
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/muonline-s16-${{ matrix.name }}:latest
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/muonline-s16-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
